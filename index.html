<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCR Simulator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM UMD (100% reliable on GitHub Pages) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @keyframes pop-in {
      0% { transform: scale(0.3) translateY(15px); opacity: 0; }
      70% { transform: scale(1.1) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes pulse-fast {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 0.45; }
    }
    .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }
    .animate-pop-in { animation: pop-in 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .animate-pulse-fast { animation: pulse-fast 1s ease-in-out infinite; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-200 m-0 p-0">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- Inline SVG Icons (Zero external icon library dependencies) ---
    const IconWrapper = ({ size = 20, className = "", children }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
      >
        {children}
      </svg>
    );

    const Thermometer = (props) => (
      <IconWrapper {...props}>
        <path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z" />
      </IconWrapper>
    );

    const Play = (props) => (
      <IconWrapper {...props}>
        <polygon points="6 3 20 12 6 21 6 3" />
      </IconWrapper>
    );

    const RefreshCw = (props) => (
      <IconWrapper {...props}>
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
        <path d="M8 16H3v5" />
      </IconWrapper>
    );

    const CheckCircle = (props) => (
      <IconWrapper {...props}>
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <path d="m9 11 3 3L22 4" />
      </IconWrapper>
    );

    const Info = (props) => (
      <IconWrapper {...props}>
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4" />
        <path d="M12 8h.01" />
      </IconWrapper>
    );

    const Timer = (props) => (
      <IconWrapper {...props}>
        <line x1="10" x2="14" y1="2" y2="2" />
        <line x1="12" x2="15" y1="14" y2="11" />
        <circle cx="12" cy="14" r="8" />
      </IconWrapper>
    );

    const Droplets = (props) => (
      <IconWrapper {...props}>
        <path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z" />
        <path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97" />
      </IconWrapper>
    );

    const Trophy = (props) => (
      <IconWrapper {...props}>
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
        <path d="M4 22h16" />
        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
      </IconWrapper>
    );

    const Flame = (props) => (
      <IconWrapper {...props}>
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
      </IconWrapper>
    );

    const Eye = (props) => (
      <IconWrapper {...props}>
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
        <circle cx="12" cy="12" r="3" />
      </IconWrapper>
    );

    const Keyboard = (props) => (
      <IconWrapper {...props}>
        <rect width="20" height="16" x="2" y="4" rx="2" ry="2" />
        <path d="M6 8h.001" />
        <path d="M10 8h.001" />
        <path d="M14 8h.001" />
        <path d="M18 8h.001" />
        <path d="M8 12h.001" />
        <path d="M12 12h.001" />
        <path d="M16 12h.001" />
        <path d="M7 16h10" />
      </IconWrapper>
    );

    const Sparkles = (props) => (
      <IconWrapper {...props}>
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
      </IconWrapper>
    );

    const Dna = (props) => (
      <IconWrapper {...props}>
        <path d="M2 15c6.667-6 13.333 0 20-6" />
        <path d="M9 22c1.798-1.998 2.518-3.995 2.807-5.993" />
        <path d="M15 2c-1.798 1.998-2.518 3.995-2.807 5.993" />
        <path d="m17 6-2.5-2.5" />
        <path d="m14 8-1-1" />
        <path d="m7 18 2.5 2.5" />
        <path d="m3.5 14.5.5.5" />
        <path d="m20 9 .5.5" />
        <path d="m6.5 12.5 1 1" />
        <path d="m16.5 10.5 1 1" />
        <path d="m10 16 1.5 1.5" />
      </IconWrapper>
    );

    // --- Biochemically Accurate Break Order ---
    // A-T bonds (2 H-bonds) melt earlier (~60-78°C), G-C bonds (3 H-bonds) melt later (~78-93°C)
    const generateBreakOrder = (top) =>
      Array.from({ length: 16 }, (_, i) => {
        const base = top[i];
        if (base === "G" || base === "C") {
          return 78 + Math.random() * 15;
        }
        return 60 + Math.random() * 18;
      });

    const generateId = () => Math.random().toString(36).substring(2, 11);

    const generateDNA = () => {
      const BASES = ["A", "T", "G", "C"];
      const compMap = { A: "T", T: "A", G: "C", C: "G" };
      const getComp = (b) => compMap[b] || "A";

      const top = Array.from(
        { length: 16 },
        () => BASES[Math.floor(Math.random() * 4)]
      );
      const bot = top.map(getComp);

      const p1Target = Math.floor(Math.random() * 5);
      const p2Target = 8 + Math.floor(Math.random() * 5);

      const p1 = top.slice(p1Target, p1Target + 4);
      const p2 = bot.slice(p2Target, p2Target + 4);

      return { top, bot, p1, p2, p1Target, p2Target };
    };

    const Base = ({
      char,
      sizeClass = "w-6 h-8 text-sm",
      animate = false,
    }) => {
      const colors = {
        A: "bg-red-500 text-white border-b-2 border-red-700",
        T: "bg-blue-500 text-white border-b-2 border-blue-700",
        G: "bg-emerald-600 text-white border-b-2 border-emerald-800",
        C: "bg-amber-400 text-slate-900 border-b-2 border-amber-600",
      };

      const bgColor = char ? colors[char] || "bg-slate-300" : "bg-slate-300";

      return (
        <div
          className={`flex items-center justify-center font-bold rounded-sm shadow-sm transition-all duration-300 select-none ${bgColor} ${
            animate ? "animate-pop-in ring-2 ring-white z-30" : ""
          } ${sizeClass} relative z-10`}
        >
          {char}
        </div>
      );
    };

    const HBonds = ({
      b1,
      b2,
      visible,
      extraClass = "",
    }) => {
      const isGC = (b1 === "G" && b2 === "C") || (b1 === "C" && b2 === "G");
      const isAT = (b1 === "A" && b2 === "T") || (b1 === "T" && b2 === "A");

      if (!b1 || !b2 || (!isGC && !isAT)) {
        return <div className={`w-full h-full ${extraClass}`}></div>;
      }

      const lines = isGC ? 3 : 2;

      return (
        <div
          className={`flex justify-center gap-[2px] sm:gap-[3.5px] h-full py-[1px] transition-all duration-[400ms] ${
            visible ? "opacity-100 scale-100" : "opacity-0 scale-y-0"
          } ${extraClass}`}
        >
          {Array.from({ length: lines }).map((_, i) => (
            <div
              key={i}
              className={`w-[1.5px] sm:w-[2px] h-full rounded-full ${
                isGC
                  ? "bg-cyan-300/95 shadow-[0_0_5px_rgba(103,232,249,0.8)]"
                  : "bg-sky-400/80 shadow-[0_0_3px_rgba(56,189,248,0.6)]"
              }`}
            ></div>
          ))}
        </div>
      );
    };

    const TaqPolymerase = ({ requiredBase }) => {
      const compMap = { A: "T", T: "A", G: "C", C: "G" };
      const targetComplement = requiredBase ? compMap[requiredBase] : null;

      return (
        <div
          title={
            targetComplement
              ? `Taq Polymerase waiting for complementary base (${targetComplement})`
              : "Taq Polymerase"
          }
          className="absolute inset-[-4px] bg-amber-400/40 border-2 border-amber-300 rounded-full animate-pulse-fast z-20 shadow-[0_0_14px_rgba(251,191,36,0.75)] flex items-center justify-center pointer-events-none"
        >
          <div className="w-1.5 h-1.5 bg-amber-200 rounded-full"></div>
        </div>
      );
    };

    // --- Draggable Primer Component ---
    const DraggablePrimer = ({
      sequence,
      type,
      locked,
      onLock,
      baseSize,
    }) => {
      const [pos, setPos] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const dragRef = useRef(null);
      const startPos = useRef({ x: 0, y: 0 });

      const handlePointerDown = (e) => {
        if (locked) return;
        e.preventDefault();
        e.target.setPointerCapture(e.pointerId);
        setIsDragging(true);
        startPos.current = { x: e.clientX - pos.x, y: e.clientY - pos.y };
      };

      const handlePointerMove = (e) => {
        if (!isDragging || locked) return;
        setPos({
          x: e.clientX - startPos.current.x,
          y: e.clientY - startPos.current.y,
        });
      };

      const handlePointerUp = (e) => {
        if (!isDragging || locked) return;
        setIsDragging(false);
        e.target.releasePointerCapture(e.pointerId);

        if (dragRef.current) {
          dragRef.current.style.pointerEvents = "none";
          const dropTarget = document.elementFromPoint(e.clientX, e.clientY);
          dragRef.current.style.pointerEvents = "auto";

          const targetZone = dropTarget && dropTarget.closest(`[data-target="${type}"]`);
          if (targetZone) {
            onLock();
            setPos({ x: 0, y: 0 });
          } else {
            setPos({ x: 0, y: 0 });
          }
        }
      };

      if (locked) return null;

      return (
        <div
          ref={dragRef}
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
          onPointerCancel={handlePointerUp}
          className={`flex items-center gap-[1px] sm:gap-[2px] px-1.5 py-1 bg-slate-700/90 rounded-md border border-slate-500 shadow-xl cursor-grab active:cursor-grabbing select-none ${
            isDragging
              ? "z-50 shadow-[0_0_24px_rgba(59,130,246,0.75)] ring-2 ring-blue-400"
              : "z-20 hover:border-blue-400/70"
          }`}
          style={{
            transform: `translate(${pos.x}px, ${pos.y}px)`,
            transition: isDragging
              ? "none"
              : "transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)",
            touchAction: "none",
          }}
        >
          <span className="text-[8px] sm:text-[9px] font-mono text-slate-400 mr-0.5">
            {type === "p1" ? "5'" : "3'"}
          </span>
          {sequence.map((b, i) => (
            <Base key={i} char={b} sizeClass={baseSize} />
          ))}
          <span className="text-[8px] sm:text-[9px] font-mono text-slate-400 ml-0.5">
            {type === "p1" ? "3'" : "5'"}
          </span>
        </div>
      );
    };

    function App() {
      const [dna, setDna] = useState(() => generateDNA());

      const [cycle, setCycle] = useState(1);
      const [step, setStep] = useState(0);
      const [time, setTime] = useState(0);
      const [isActive, setIsActive] = useState(false);

      const [scores, setScores] = useState([]);
      const [playerName, setPlayerName] = useState("");
      const [scoreSubmitted, setScoreSubmitted] = useState(false);

      const [molecules, setMolecules] = useState([]);
      const [activeStrands, setActiveStrands] = useState([]);
      const [extensions, setExtensions] = useState({});

      const [temperature, setTemperature] = useState(25);
      const [p1Locked, setP1Locked] = useState(false);
      const [p2Locked, setP2Locked] = useState(false);
      const [showAnnealHint, setShowAnnealHint] = useState(false);
      const [errorFlash, setErrorFlash] = useState(false);

      const isAnnealed = p1Locked && p2Locked;

      useEffect(() => {
        try {
          const savedScores = localStorage.getItem("pcr_leaderboard");
          if (savedScores) {
            setScores(JSON.parse(savedScores));
          }
        } catch (e) {
          console.error("Could not load scores", e);
        }
      }, []);

      const checkIsExtended = useCallback(() => {
        if (activeStrands.length === 0) return false;
        return activeStrands.every((strand) => {
          const ext = extensions[strand.id] || [];
          if (strand.type === "bot") {
            const nextIdx = dna.p1Target + 4 + ext.length;
            return nextIdx >= 16 || strand.seq[nextIdx] === null;
          } else {
            const nextIdx = dna.p2Target - 1 - ext.length;
            return nextIdx < 0 || strand.seq[nextIdx] === null;
          }
        });
      }, [activeStrands, extensions, dna]);

      const isExtended = checkIsExtended();

      const advanceCycle = useCallback(() => {
        const newMolecules = [];

        activeStrands.forEach((strand) => {
          const ext = extensions[strand.id] || [];
          if (strand.type === "bot") {
            const newTop = Array(16).fill(null);
            for (let i = 0; i < 4; i++) newTop[dna.p1Target + i] = dna.p1[i];
            ext.forEach((b, i) => (newTop[dna.p1Target + 4 + i] = b));
            newMolecules.push({
              id: generateId(),
              top: newTop,
              bot: strand.seq,
              breakOrder: generateBreakOrder(newTop),
            });
          } else {
            const newBot = Array(16).fill(null);
            for (let i = 0; i < 4; i++) newBot[dna.p2Target + i] = dna.p2[i];
            ext.forEach((b, i) => (newBot[dna.p2Target - 1 - i] = b));
            newMolecules.push({
              id: generateId(),
              top: strand.seq,
              bot: newBot,
              breakOrder: generateBreakOrder(strand.seq),
            });
          }
        });

        setMolecules(newMolecules);
        setCycle((c) => c + 1);
        setStep(1);
        setTemperature(25);
        setP1Locked(false);
        setP2Locked(false);
        setShowAnnealHint(false);
      }, [activeStrands, extensions, dna]);

      useEffect(() => {
        let timer;
        if (step === 2 && isAnnealed) {
          timer = setTimeout(() => setStep(3), 600);
        } else if (step === 3 && isExtended) {
          timer = setTimeout(() => setStep(4), 800);
        }
        return () => clearTimeout(timer);
      }, [step, isAnnealed, isExtended]);

      useEffect(() => {
        let timer;
        if (step === 4) {
          timer = setTimeout(() => {
            if (cycle < 3) {
              advanceCycle();
            } else {
              setStep(5);
              setIsActive(false);
            }
          }, 1500);
        }
        return () => clearTimeout(timer);
      }, [step, cycle, advanceCycle]);

      useEffect(() => {
        let interval;
        if (isActive && step > 0 && step < 5) {
          interval = setInterval(() => setTime((t) => t + 1), 1000);
        } else {
          clearInterval(interval);
        }
        return () => clearInterval(interval);
      }, [isActive, step]);

      useEffect(() => {
        if (step === 2) setTemperature(55);
        if (step === 3) setTemperature(72);
        if (step === 5) setScoreSubmitted(false);
      }, [step]);

      const handleHeatTap = useCallback(() => {
        if (step === 1 && temperature < 95) {
          const nextTemp = Math.min(temperature + 8, 95);
          setTemperature(nextTemp);

          if (nextTemp >= 95) {
            setTimeout(() => {
              const strands = [];
              molecules.forEach((m) => {
                strands.push({ id: m.id + "_top", type: "top", seq: m.top });
                strands.push({ id: m.id + "_bot", type: "bot", seq: m.bot });
              });
              setActiveStrands(strands);
              setExtensions({});
              setStep(2);
            }, 1100);
          }
        }
      }, [step, temperature, molecules]);

      const handleBaseType = useCallback(
        (base) => {
          if (step !== 3 || isExtended) return;

          let added = false;
          const newExts = { ...extensions };

          activeStrands.forEach((strand) => {
            const ext = newExts[strand.id] || [];

            if (strand.type === "bot") {
              const nextIdx = dna.p1Target + 4 + ext.length;
              if (nextIdx < 16 && strand.seq[nextIdx] !== null) {
                if (dna.top[nextIdx] === base) {
                  newExts[strand.id] = [...ext, base];
                  added = true;
                }
              }
            } else {
              const nextIdx = dna.p2Target - 1 - ext.length;
              if (nextIdx >= 0 && strand.seq[nextIdx] !== null) {
                if (dna.bot[nextIdx] === base) {
                  newExts[strand.id] = [...ext, base];
                  added = true;
                }
              }
            }
          });

          if (added) {
            setExtensions(newExts);
          } else {
            setErrorFlash(true);
            setTimeout(() => setErrorFlash(false), 300);
          }
        },
        [step, isExtended, extensions, activeStrands, dna]
      );

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (
            document.activeElement &&
            (document.activeElement.tagName === "INPUT" ||
              document.activeElement.tagName === "TEXTAREA")
          ) {
            return;
          }

          if (step === 1 && (e.code === "Space" || e.code === "Enter")) {
            e.preventDefault();
            handleHeatTap();
          } else if (step === 3) {
            const key = e.key.toUpperCase();
            if (["A", "T", "C", "G"].includes(key)) {
              e.preventDefault();
              handleBaseType(key);
            }
          }
        };

        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [step, handleHeatTap, handleBaseType]);

      const startGame = () => {
        const newDna = generateDNA();
        setDna(newDna);
        setMolecules([
          {
            id: generateId(),
            top: newDna.top,
            bot: newDna.bot,
            breakOrder: generateBreakOrder(newDna.top),
          },
        ]);
        setCycle(1);
        setStep(1);
        setTime(0);
        setIsActive(true);
        setTemperature(25);
        setP1Locked(false);
        setP2Locked(false);
        setShowAnnealHint(false);
        setExtensions({});
        setPlayerName("");
        setScoreSubmitted(false);
      };

      const handleScoreSubmit = (e) => {
        e.preventDefault();
        if (!playerName.trim()) return;

        const newScores = [...scores, { name: playerName.toUpperCase(), time }];
        newScores.sort((a, b) => a.time - b.time);
        const top5 = newScores.slice(0, 5);

        setScores(top5);
        try {
          localStorage.setItem("pcr_leaderboard", JSON.stringify(top5));
        } catch (e) {
          console.error("Could not save score", e);
        }
        setScoreSubmitted(true);
      };

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}:${s.toString().padStart(2, "0")}`;
      };

      const qualifiesForLeaderboard =
        scores.length < 5 || time < ((scores[scores.length - 1] && scores[scores.length - 1].time) || Infinity);

      const baseSize =
        cycle === 3
          ? "w-[14px] h-[18px] text-[8px] sm:w-[18px] sm:h-[22px] sm:text-[10px]"
          : cycle === 2
          ? "w-4 h-5 text-[10px] sm:w-5 sm:h-6 sm:text-xs"
          : "w-5 h-6 text-xs sm:w-6 sm:h-8 sm:text-sm";
      const gapSize = cycle === 3 ? "gap-[1px]" : "gap-[2px] sm:gap-1";

      return (
        <div className="min-h-screen bg-slate-900 text-slate-200 font-sans selection:bg-blue-500/30 flex flex-col">
          {/* Header Bar */}
          <header className="bg-slate-800/95 backdrop-blur border-b border-slate-700 p-3 sm:p-4 flex items-center justify-between sticky top-0 z-40 shadow-md">
            <div className="flex-1 hidden sm:flex items-center gap-3">
              {step > 0 && (
                <>
                  <span className="px-2.5 py-1 rounded-full bg-slate-700/80 text-blue-300 font-bold text-xs tracking-widest uppercase border border-slate-600">
                    Cycle {Math.min(cycle, 3)} / 3
                  </span>
                  <span className="text-xs text-slate-400 font-mono">
                    {step === 1
                      ? `${molecules.length} dsDNA`
                      : `${activeStrands.length} ssDNA templates`}
                  </span>
                </>
              )}
            </div>
            <div className="text-center flex-1 min-w-[160px]">

                <Dna className="text-blue-400" size={20} />

              </h1>
              {step > 0 && (
                <p className="text-[10px] text-slate-400 sm:hidden block mt-0.5">
                  Cycle {Math.min(cycle, 3)}/3 •{" "}
                  {step === 1

            </div>
            <div className="flex-1 flex justify-end items-center gap-3">
              {step > 0 && step < 5 && (
                <button
                  onClick={startGame}
                  title="Restart Experiment"

                  <RefreshCw size={16} />
                </button>

              <div
                className={`flex items-center gap-1.5 font-mono text-sm sm:text-lg font-bold px-2.5 py-1 rounded-lg bg-slate-900/70 border border-slate-700/80 ${
                  isActive ? "text-emerald-400" : "text-slate-500"

              >
                <Timer size={16} />
                {formatTime(time)}
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-5xl w-full mx-auto p-2 sm:p-4 flex flex-col">
            {/* STEP 0: Start Screen */}
            {step === 0 && (

                <div className="w-20 h-20 sm:w-24 sm:h-24 bg-blue-500/10 border border-blue-500/30 rounded-full flex items-center justify-center mb-1 shadow-[0_0_30px_rgba(59,130,246,0.2)]">
                  <Play className="text-blue-400 ml-1.5" size={44} />

                <h2 className="text-2xl sm:text-4xl font-bold text-white px-4">
                  Amplify the Target DNA

                <p className="text-slate-400 max-w-lg px-6 text-sm sm:text-base leading-relaxed">
                  Run <strong>3 thermal cycles</strong> of Polymerase Chain Reaction
                  (Denaturation, Annealing, and Extension) to exponentially isolate
                  a specific target amplicon from a random 16-bp DNA template.
                </p>

                <div className="flex flex-wrap items-center justify-center gap-4 bg-slate-800/60 px-4 py-2.5 rounded-xl border border-slate-700/70 text-xs text-slate-300">

                    <Base char="A" sizeClass="w-5 h-6 text-xs" />
                    <span>↔</span>
                    <Base char="T" sizeClass="w-5 h-6 text-xs" />

                  </div>
                  <div className="h-4 w-[1px] bg-slate-700 hidden sm:block" />
                  <div className="flex items-center gap-1.5">
                    <Base char="G" sizeClass="w-5 h-6 text-xs" />
                    <span>↔</span>
                    <Base char="C" sizeClass="w-5 h-6 text-xs" />
                    <span className="text-slate-400 ml-1">(3 H-bonds)</span>
                  </div>
                </div>

                <button
                  onClick={startGame}
                  className="mt-4 px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-full font-bold text-lg shadow-[0_0_24px_rgba(37,99,235,0.45)] transition-all transform hover:scale-105 active:scale-95 flex items-center gap-2"

                </button>

                          {idx + 1}. {score.name}
                        </span>
                        <span className="text-emerald-400 font-mono font-bold">
                          {formatTime(score.time)}
                        </span>
                      </div>
                    ))
                  )}
                </div>

                      <div

                            : temperature >= 70
                            ? "bg-orange-500"
                            : "bg-blue-400"

                                >
                                  {mol.bot[i] ? (
                                    <Base
                                      char={mol.bot[i] || null}

                                    <div className={baseSize} />

                            </div>

                            <div className="flex flex-col justify-between h-full pr-1.5 text-[9px] sm:text-[10px] font-mono font-bold text-slate-500 select-none">

                              <span className="mt-3">3'</span>
                            </div>

                            {Array.from({ length: 16 }).map((_, i) => {
                              const tBase = strand.seq[i];
                              let pBase = null;
                              let isExtBase = false;
                              let isTaqTarget = false;

                              if (isTopTemp) {
                                if (
                                  p2Locked &&
                                  i >= dna.p2Target &&
                                  i < dna.p2Target + 4
                                ) {
                                  pBase = dna.p2[i - dna.p2Target];
                                }
                                if (
                                  p2Locked &&
                                  i < dna.p2Target &&
                                  i >= dna.p2Target - ext.length
                                ) {
                                  pBase = ext[dna.p2Target - 1 - i] || null;
                                  isExtBase = i === dna.p2Target - ext.length;
                                }
                                if (
                                  step === 3 &&
                                  p2Locked &&
                                  i === dna.p2Target - 1 - ext.length &&
                                  tBase !== null
                                ) {
                                  isTaqTarget = true;
                                }
                              } else {
                                if (
                                  p1Locked &&
                                  i >= dna.p1Target &&
                                  i < dna.p1Target + 4
                                ) {
                                  pBase = dna.p1[i - dna.p1Target];
                                }
                                if (
                                  p1Locked &&
                                  i > dna.p1Target + 3 &&
                                  i < dna.p1Target + 4 + ext.length
                                ) {
                                  pBase = ext[i - dna.p1Target - 4] || null;
                                  isExtBase = i === dna.p1Target + 3 + ext.length;
                                }
                                if (
                                  step === 3 &&
                                  p1Locked &&
                                  i === dna.p1Target + 4 + ext.length &&
                                  tBase !== null
                                ) {
                                  isTaqTarget = true;
                                }
                              }

                              const isP2HintZone =
                                step === 2 &&
                                !p2Locked &&
                                isTopTemp &&
                                tBase !== null &&
                                i >= dna.p2Target &&
                                i < dna.p2Target + 4;

                              const isP1HintZone =
                                step === 2 &&
                                !p1Locked &&
                                !isTopTemp &&
                                tBase !== null &&
                                i >= dna.p1Target &&
                                i < dna.p1Target + 4;

                              return (
                                <div
                                  key={i}
                                  className="flex flex-col items-center relative"
                                >
                                  {isTopTemp ? (
                                    <>
                                      {tBase ? (
                                        <Base
                                          char={tBase || null}
                                          sizeClass={baseSize}
                                        />
                                      ) : (
                                        <div className={baseSize} />
                                      )}
                                      <div className="h-[10px] sm:h-[14px] flex items-center justify-center w-full">
                                        <HBonds
                                          b1={tBase || null}
                                          b2={pBase || null}
                                          visible={true}
                                        />
                                      </div>
                                      <div className="relative">
                                        {isTaqTarget && !isExtended && (
                                          <TaqPolymerase requiredBase={tBase} />
                                        )}
                                        {pBase ? (
                                          <Base
                                            char={pBase || null}
                                            sizeClass={baseSize}
                                            animate={isExtBase}
                                          />
                                        ) : (
                                          <div
                                            className={`${baseSize} rounded-sm transition-colors ${
                                              showAnnealHint && isP2HintZone
                                                ? "border border-dashed border-amber-400/80 bg-amber-400/10"
                                                : ""
                                            }`}
                                          />
                                        )}

                                        {step === 2 &&
                                          !p2Locked &&
                                          i === dna.p2Target && (
                                            <div
                                              data-target="p2"
                                              onClick={() => {

                                                  setP2Locked(true);
                                              }}
                                              className="absolute top-1/2 -translate-y-1/2 left-0 h-[220%] z-30 pointer-events-auto"
                                              style={{ width: "calc(400% + 12px)" }}
                                            />
                                          )}
                                      </div>
                                    </>
                                  ) : (
                                    <>
                                      <div className="relative">
                                        {isTaqTarget && !isExtended && (
                                          <TaqPolymerase requiredBase={tBase} />
                                        )}
                                        {pBase ? (
                                          <Base
                                            char={pBase || null}
                                            sizeClass={baseSize}
                                            animate={isExtBase}
                                          />
                                        ) : (
                                          <div
                                            className={`${baseSize} rounded-sm transition-colors ${
                                              showAnnealHint && isP1HintZone
                                                ? "border border-dashed border-amber-400/80 bg-amber-400/10"
                                                : ""
                                            }`}
                                          />
                                        )}

                                        {step === 2 &&
                                          !p1Locked &&
                                          i === dna.p1Target && (
                                            <div
                                              data-target="p1"
                                              onClick={() => {
                                                if (showAnnealHint)
                                                  setP1Locked(true);
                                              }}
                                              className="absolute top-1/2 -translate-y-1/2 left-0 h-[220%] z-30 pointer-events-auto"
                                              style={{ width: "calc(400% + 12px)" }}
                                            />

                                      <div className="h-[10px] sm:h-[14px] flex items-center justify-center w-full">
                                        <HBonds
                                          b1={pBase || null}
                                          b2={tBase || null}
                                          visible={true}
                                        />
                                      </div>
                                      {tBase ? (
                                        <Base
                                          char={tBase || null}
                                          sizeClass={baseSize}
                                        />
                                      ) : (
                                        <div className={baseSize} />
                                      )}
                                    </>
                                  )}
                                </div>
                              );
                            })}

                            <div className="flex flex-col justify-between h-full pl-1.5 text-[9px] sm:text-[10px] font-mono font-bold text-slate-500 select-none">
                              <span>3'</span>
                              <span className="mt-3">5'</span>
                            </div>
                          </div>

                      })}
                  </div>

                {/* Bottom Control Dock */}

                      <Flame size={18} />

                  {step === 2 && (
                    <div className="flex flex-col w-full items-center max-w-md mx-auto">

                            Forward Primer (P1)

                        <div className="flex flex-col items-center w-36 relative">

                            Reverse Primer (P2)
                          </span>
                          <DraggablePrimer
                            sequence={dna.p2}
                            type="p2"
                            locked={p2Locked}

                            baseSize={baseSize}

                            <div className="flex items-center gap-1 text-emerald-400 text-xs font-bold mt-1">
                              <CheckCircle size={16} /> Annealed

                  {step === 3 && (

                      {isExtended ? (

                          <CheckCircle className="text-emerald-500 mb-2" size={40} />

                            5' → 3' Extension Complete!

                      ) : (

                          <div className="flex items-center justify-between mb-2.5 text-slate-400 px-1">

                              <Droplets size={15} className="text-blue-400" />

                              <button
                                key={base}
                                onClick={() => handleBaseType(base)}
                                className="h-12 sm:h-14 text-xl sm:text-2xl font-black rounded-xl shadow-[0_4px_0_rgba(0,0,0,0.3)] transform transition-all active:translate-y-1 active:shadow-none hover:brightness-110 flex items-center justify-center bg-slate-700 border border-slate-600 relative overflow-hidden group"

                                  sizeClass="w-full h-full rounded-lg shadow-none"
                                />
                                <div className="absolute inset-0 bg-white/0 group-active:bg-white/20 transition-colors"></div>
                              </button>

                      ) : (
                        <div className="flex items-center gap-2 text-emerald-400 mt-3 text-sm font-bold animate-pulse">
                          <Sparkles size={18} /> Isolating Target Amplicon...
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* STEP 5: Final Amplicon Showcase & Leaderboard */}
            {step === 5 && (
              <div className="flex-1 flex flex-col items-center justify-center space-y-6 text-center py-6">
                <h2 className="text-2xl sm:text-3xl font-bold text-white flex items-center gap-3">
                  <CheckCircle className="text-emerald-400" size={32} /> Target
                  Amplicon Isolated!
                </h2>
                <div className="flex flex-wrap items-center justify-center gap-4 text-sm">
                  <span className="px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300">
                    Completion Time:{" "}
                    <strong className="text-emerald-400 font-mono text-base">
                      {formatTime(time)}
                    </strong>
                  </span>
                  <span className="px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300">
                    Amplicon Length:{" "}
                    <strong className="text-blue-400 font-mono text-base">
                      {dna.p2Target + 4 - dna.p1Target} bp
                    </strong>
                  </span>
                  <span className="px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300">
                    Total Yield:{" "}
                    <strong className="text-amber-300 font-mono text-base">
                      8 dsDNA copies (2 pure target-length)
                    </strong>
                  </span>
                </div>

                <div className="w-full max-w-lg bg-slate-800 p-4 sm:p-6 rounded-2xl border border-slate-700 shadow-xl overflow-x-auto">
                  <h3 className="text-[10px] sm:text-xs font-bold text-slate-400 uppercase mb-4 tracking-wider text-center">
                    Isolated Target Amplicon ({dna.p2Target + 4 - dna.p1Target} Base
                    Pairs)
                  </h3>
                  <div className="flex items-center justify-center gap-1 sm:gap-2 min-w-max mx-auto py-2">
                    <div className="flex flex-col justify-between h-16 pr-1 text-[10px] font-mono font-bold text-slate-500">
                      <span>5'</span>
                      <span>3'</span>
                    </div>
                    {Array.from({ length: dna.p2Target + 4 - dna.p1Target }).map(
                      (_, i) => {
                        const topBase = dna.top[i + dna.p1Target];
                        const botBase = dna.bot[i + dna.p1Target];
                        return (
                          <div key={i} className="flex flex-col items-center">
                            <Base
                              char={topBase}
                              sizeClass="w-5 h-7 sm:w-8 sm:h-10 text-xs sm:text-base"
                            />
                            <div className="h-[10px] sm:h-[14px] flex items-center w-full">
                              <HBonds b1={topBase} b2={botBase} visible={true} />
                            </div>
                            <Base
                              char={botBase}
                              sizeClass="w-5 h-7 sm:w-8 sm:h-10 text-xs sm:text-base"
                            />
                          </div>
                        );
                      }
                    )}
                    <div className="flex flex-col justify-between h-16 pl-1 text-[10px] font-mono font-bold text-slate-500">
                      <span>3'</span>
                      <span>5'</span>
                    </div>
                  </div>
                </div>

                <div className="w-full max-w-md bg-slate-800/80 p-5 rounded-2xl border border-slate-700 mt-2">
                  <div className="flex items-center justify-center gap-2 mb-4 text-slate-300">
                    <Trophy className="text-yellow-400" size={20} />
                    <h3 className="font-bold text-lg text-yellow-300">
                      Local Leaderboard
                    </h3>
                  </div>

                  {qualifiesForLeaderboard && !scoreSubmitted ? (
                    <form onSubmit={handleScoreSubmit} className="flex gap-2 mb-6">
                      <input
                        type="text"
                        maxLength={3}
                        value={playerName}
                        onChange={(e) =>
                          setPlayerName(e.target.value.toUpperCase())
                        }
                        placeholder="AAA"
                        className="bg-slate-900 border border-slate-600 text-white px-4 py-2 rounded-lg w-24 text-center font-bold uppercase focus:outline-none focus:border-blue-500"
                        required
                      />
                      <button
                        type="submit"
                        className="flex-1 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold transition-colors"
                      >
                        Save Score
                      </button>
                    </form>
                  ) : null}

                  <div className="space-y-2">
                    {scores.length === 0 && (
                      <div className="text-slate-500 italic">
                        No scores saved yet.
                      </div>
                    )}
                    {scores.map((score, idx) => (
                      <div
                        key={idx}
                        className={`flex justify-between items-center p-2 rounded ${
                          score.time === time && scoreSubmitted
                            ? "bg-blue-600/20 border border-blue-500/50"
                            : "bg-slate-900/50"
                        }`}
                      >
                        <span className="text-slate-300 font-mono font-bold">
                          {idx + 1}. {score.name}
                        </span>
                        <span className="text-emerald-400 font-mono font-bold">
                          {formatTime(score.time)}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                <button
                  onClick={startGame}
                  className="mt-2 flex items-center gap-2 px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-full font-bold text-sm sm:text-lg shadow-lg transition-all active:scale-95"
                >
                  <RefreshCw size={20} /> Play Again
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    if (rootElement) {
      ReactDOM.createRoot(rootElement).render(<App />);
    }
  </script>
</body>
</html>
